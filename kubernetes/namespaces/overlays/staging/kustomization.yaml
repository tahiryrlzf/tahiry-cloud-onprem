apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - namespace.yaml
  - ../../base

# Staging : quotas réduits de moitié par rapport à prod.
patches:
  - target:
      kind: ResourceQuota
      name: compute-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "500m"
      - op: replace
        path: /spec/hard/requests.memory
        value: 512Mi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "1"
      - op: replace
        path: /spec/hard/limits.memory
        value: 1Gi
      - op: replace
        path: /spec/hard/pods
        value: "6"

---
- name: Désactiver le swap (requis par k3s)
  command: swapoff -a
  changed_when: false

- name: Commenter le swap dans /etc/fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Charger modules kernel
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Sysctl Kubernetes
  copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  notify: reload sysctl

- name: Installer paquets requis
  apt:
    name: [curl, ca-certificates]
    state: present
    update_cache: true

- name: Vérifier si k3s est installé
  stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Installer k3s single-node
  shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      sh -s - server --write-kubeconfig-mode 600
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_bin.stat.exists

- name: Attendre que k3s soit prêt
  command: k3s kubectl get nodes
  register: k3s_ready
  until: k3s_ready.rc == 0 and ' Ready ' in k3s_ready.stdout
  retries: 30
  delay: 5
  changed_when: false

- name: Créer ~/.kube local
  delegate_to: localhost
  become: false
  file:
    path: /home/sysadmin/.kube
    state: directory
    mode: '0700'

- name: Récupérer le kubeconfig
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/sysadmin/.kube/vps2-config
    flat: true

- name: Corriger l'IP dans le kubeconfig local
  delegate_to: localhost
  become: false
  replace:
    path: /home/sysadmin/.kube/vps2-config
    regexp: 'https://127.0.0.1:6443'
    replace: 'https://10.10.0.2:6443'

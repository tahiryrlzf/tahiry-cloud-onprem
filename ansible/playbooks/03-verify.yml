---
- name: Vérifier la migration
  hosts: vps2
  become: true
  tasks:
    - name: Nodes
      ansible.builtin.command: k3s kubectl get nodes -o wide
      changed_when: false
      register: nodes

    - name: Pods
      ansible.builtin.command: k3s kubectl get pods -A -o wide
      changed_when: false
      register: pods

    - name: Ingress
      ansible.builtin.command: k3s kubectl get ingress -A
      changed_when: false
      register: ingress

    - name: Test HTTP prod
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: tahiry-cloud.com
        follow_redirects: none
      failed_when: false
      register: http_prod

    - name: Test HTTP staging
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: staging.tahiry-cloud.com
        follow_redirects: none
      failed_when: false
      register: http_staging

    - name: Résumé
      ansible.builtin.debug:
        msg:
          - "{{ nodes.stdout }}"
          - "{{ pods.stdout }}"
          - "{{ ingress.stdout }}"
          - "HTTP prod    : {{ http_prod.status }}"
          - "HTTP staging : {{ http_staging.status }}"
